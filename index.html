<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KLRS Nail Spa</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{

background:#F4EFE8;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.container{

width:90%;
max-width:1200px;

}

.logo{

text-align:center;
margin-bottom:50px;

}

.logo h1{

font-size:60px;
color:#5A392B;
letter-spacing:6px;

}

.logo p{

font-size:22px;
color:#9A806E;
margin-top:10px;

}

.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:25px;

}

.card{

background:white;

border-radius:22px;

padding:35px;

font-size:28px;

color:#5A392B;

text-align:center;

cursor:pointer;

transition:.25s;

box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.card:hover{

background:#5A392B;

color:white;

transform:translateY(-6px);

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<h1>KLRS</h1>

<p>Luxury Nail & Lash Experience</p>

</div>

<div class="grid">

<div class="card">💅 خدماتنا</div>

<div class="card">📅 احجز الآن</div>

<div class="card">👩‍🎨 أعمالنا</div>

<div class="card">☕ المشروبات</div>

<div class="card">🎁 العروض</div>

<div class="card">⭐ قيّمنا</div>

<div class="card">ℹ️ من نحن</div>

<div class="card">🌐 العربية | English</div>

</div>

</div>

</body>

</html>
